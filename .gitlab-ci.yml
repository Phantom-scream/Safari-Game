image: python:3.11

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install pygame
  # If you have a requirements.txt, use:
  # - pip install -r requirements.txt

stages:
  - test

run_game:
  stage: test
  script:
    - echo "Running your Python game!"
    - python -m pip install pytest
    - python -m pytest || true  # Run tests if you have any, don't fail if none
    - |
      # Try to run the game in headless mode (no display)
      export SDL_VIDEODRIVER=dummy
      python game.py || echo "Game exited (expected in CI, no display)"